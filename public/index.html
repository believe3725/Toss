<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --paper:#F1EEE4;
    --paper-2:#FBF9F3;
    --card:#FFFFFF;
    --ink:#232B3D;
    --ink-soft:#5B6472;
    --ink-faint:#9B9587;
    --hair:#DFD8C6;
    --hair-strong:#C7BEA6;
    --brass:#A9832F;
    --brass-dark:#7E6122;
    --jade:#2F6F62;
    --jade-bg:#E4EFEA;
    --rust:#B0463D;
    --rust-bg:#F7E7E4;
    --amber-bg:#F6ECD9;
    --amber-ink:#8A5F14;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:960px;margin:0 auto;padding:28px 20px 80px;}
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .masthead h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead p{margin:4px 0 0;color:var(--ink-soft);font-size:13px;}
  .month-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .month-tab{
    font-family:'Noto Serif KR', serif;
    font-size:14px;
    padding:8px 14px 7px;
    background:var(--paper-2);
    border:1px solid var(--hair);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:1px;
  }
  .month-tab.active{
    background:var(--card);
    color:var(--ink);
    border-color:var(--hair-strong);
    font-weight:700;
  }
  .month-tab{display:inline-flex;align-items:center;gap:4px;}
  .month-tab-label{cursor:pointer;}
  .month-del{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;
    font-size:13px;line-height:1;padding:0 2px;
  }
  .month-del:hover{color:var(--rust);}
  .month-tab-confirm{gap:8px;font-size:13px;color:var(--rust);}
  .month-tab-confirm .btn{padding:5px 10px;font-size:12px;}
  .month-add{
    width:32px;height:32px;border-radius:50%;border:1px dashed var(--hair-strong);
    background:transparent;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;
  }
  .month-add:hover{border-color:var(--brass);color:var(--brass);}
  .month-add-form{display:flex;align-items:center;gap:6px;}
  .month-add-form input{
    font-family:'Noto Sans KR', sans-serif;
    border:1px solid var(--hair-strong);border-radius:6px;
    padding:7px 8px;font-size:13px;background:var(--paper-2);color:var(--ink);width:150px;
  }
  .month-add-form input:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .month-add-form .btn{padding:7px 10px;font-size:12px;}
  .month-hint{font-size:11px;color:var(--ink-faint);width:100%;margin-top:4px;}

  .summary-strip{
    background:var(--card);
    border:1px solid var(--hair-strong);
    border-radius:0 10px 10px 10px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    margin-bottom:24px;
    overflow:hidden;
  }
  .summary-cell{
    padding:16px 18px;
    border-right:1px solid var(--hair);
  }
  .summary-cell:last-child{border-right:none;}
  .summary-label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .summary-value{
    font-family:'Noto Serif KR', serif;
    font-size:21px;
    font-weight:700;

  }
  .summary-value.pos{color:var(--jade);}
  .summary-value.neg{color:var(--rust);}

  .tabnav{display:flex;gap:4px;border-bottom:1px solid var(--hair-strong);margin-bottom:22px;}
  .tabnav button{
    background:none;border:none;padding:10px 16px;font-size:14px;color:var(--ink-soft);
    cursor:pointer;border-bottom:2px solid transparent;font-weight:500;
    font-family:'Noto Sans KR', sans-serif;
  }
  .tabnav button.active{color:var(--ink);border-bottom-color:var(--brass);font-weight:700;}

  .panel-title{font-family:'Noto Serif KR', serif;font-size:17px;font-weight:700;margin:0 0 12px;}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:720px){.grid-2{grid-template-columns:1fr;} .summary-strip{grid-template-columns:1fr 1fr;}}

  .entry-form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:16px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--ink-soft);}
  .field input, .field select{
    font-family:'Noto Sans KR', sans-serif;
    border:1px solid var(--hair-strong);
    border-radius:6px;
    padding:7px 8px;
    font-size:13px;
    background:var(--paper-2);
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .field.grow{flex:1;min-width:120px;}
  .btn{
    border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:'Noto Sans KR', sans-serif;
  }
  .btn-brass{background:var(--brass);color:#fff;}
  .btn-brass:hover{background:var(--brass-dark);}
  .btn-ghost{background:transparent;border:1px solid var(--hair-strong);color:var(--ink-soft);}

  table.ledger{width:100%;border-collapse:collapse;font-size:13px;}
  table.ledger th{
    text-align:left;color:var(--ink-soft);font-weight:500;font-size:11px;
    padding:6px 8px;border-bottom:1px solid var(--hair-strong);
  }
  table.ledger td{padding:8px 8px;border-bottom:1px solid var(--hair);vertical-align:middle;}
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .tag{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
    color:#fff;font-weight:500;
  }
  .del-btn{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;
    padding:2px 4px;
  }
  .del-btn:hover{color:var(--rust);}
  .edit-btn{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;
    padding:2px 4px;
  }
  .edit-btn:hover{color:var(--brass);}
  .row-actions{white-space:nowrap;}
  .empty-row{color:var(--ink-faint);font-size:12px;text-align:center;padding:18px 0;}
  .foot-row td{font-weight:700;border-top:1px solid var(--hair-strong);border-bottom:none;padding-top:10px;}

  .budget-row{display:grid;grid-template-columns:90px 1fr 130px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);}
  .budget-row:last-child{border-bottom:none;}
  .budget-cat{font-size:13px;font-weight:500;}
  .budget-bar-track{height:8px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--hair);}
  .budget-bar-fill{height:100%;border-radius:6px;}
  .budget-nums{font-size:11px;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums;}
  .budget-input{width:110px;text-align:right;}

  .legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:10px;font-size:12px;color:var(--ink-soft);}
  .saving-row{grid-template-columns:170px 1fr 30px;}
  .sub-tabnav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .sub-tab-btn{
    padding:6px 14px;border-radius:20px;border:1px solid var(--hair-strong);
    background:var(--paper-2);font-size:13px;cursor:pointer;color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
  }
  .sub-tab-btn.active{background:var(--brass);color:#fff;border-color:var(--brass);font-weight:700;}
  .legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;}

  .section-note{font-size:12px;color:var(--ink-faint);margin-top:-6px;margin-bottom:14px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const FIXED_CATS = ['주거비','통신비','보험','할부/대출','정기구독','교육','저축/투자','헌금'];
const VAR_CATS = ['식비','생활용품','교육비','교통비','의류비','문화생활','경조사비','선물비','병원비','용돈','기타'];
const INCOME_CATS = ['남편 수입','아내 수입','부수입','기타 수입'];

const CAT_COLOR = {
  '주거비':'#8C6D46','통신비':'#4472A8','보험':'#6B8F71','할부/대출':'#B08D57',
  '정기구독':'#7D6B87','교육':'#5B7B9A','저축/투자':'#2F6F62','헌금':'#9C6B44',
  '식비':'#C1622D','생활용품':'#7A8B99','교육비':'#4472A8','교통비':'#5B7B9A',
  '의류비':'#8B6F9E','문화생활':'#B08D57','경조사비':'#9C6B44','선물비':'#C1622D',
  '병원비':'#B0463D','용돈':'#6B8F71','기타':'#7D7568',
  '남편 수입':'#4472A8','아내 수입':'#C1622D','부수입':'#2F6F62','기타 수입':'#7D7568',
  '적립성':'#2F6F62','일시납':'#A9832F','미분류':'#7D7568'
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeAttr(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function parseAmountInput(v){
  if(v === null || v === undefined) return 0;
  const n = Number(String(v).replace(/[^0-9.-]/g,''));
  return isNaN(n) ? 0 : n;
}
function formatAmountInput(el){
  el.setAttribute('inputmode','numeric');
  el.addEventListener('input', ()=>{
    let raw = el.value.replace(/[^0-9]/g,'');
    raw = raw.replace(/^0+(?=\d)/,'');
    if(raw === ''){ el.value = ''; return; }
    const caretAtEnd = el.selectionStart === el.value.length;
    el.value = Number(raw).toLocaleString('ko-KR');
    if(caretAtEnd) el.setSelectionRange(el.value.length, el.value.length);
  });
}
function wireAmountInputs(root){
  (root||document).querySelectorAll('.num-fmt').forEach(formatAmountInput);
}
function won(n){
  n = Math.round(Number(n)||0);
  const sign = n < 0 ? '-' : '';
  return sign + '₩' + Math.abs(n).toLocaleString('ko-KR');
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  const [y,m] = key.split('-');
  return y + '년 ' + parseInt(m,10) + '월';
}
function emptyMonthData(){
  return { income:[], fixed:[], variable:[], budgets:{} };
}

let months = [];
let savings = [];
let investments = [];
let invSubTab = '예금';
let tossConfig = { url: '', token: '' };
let tossSyncing = false;
let tossLastSynced = null;
let editingEntry = { kind: null, id: null };
let editingSavingId = null;
let editingInvestId = null;
let currentMonth = todayKey();
let currentTab = 'dashboard';
let data = emptyMonthData();
let charts = {};
let addMonthFormOpen = false;
let syncFormOpen = false;
let deleteConfirmMonth = null;
let toastTimer = null;

const HAS_CLOUD_STORAGE = (typeof window !== 'undefined') && !!window.storage
  && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';

let remoteConfig = null; // { url, token } — 여러 기기 동기화가 설정되면 채워짐

function loadRemoteConfig(){
  try{
    const raw = localStorage.getItem('gagyebu_remote_config');
    remoteConfig = raw ? JSON.parse(raw) : null;
  }catch(e){ remoteConfig = null; }
}

function saveRemoteConfig(cfg){
  remoteConfig = cfg;
  try{ localStorage.setItem('gagyebu_remote_config', JSON.stringify(cfg)); }catch(e){}
}

function clearRemoteConfig(){
  remoteConfig = null;
  try{ localStorage.removeItem('gagyebu_remote_config'); }catch(e){}
}

function showToast(msg, tone){
  let el = document.getElementById('toastBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'toastBanner';
    el.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;font-family:"Noto Sans KR",sans-serif;box-shadow:0 4px 14px rgba(0,0,0,0.18);max-width:90vw;text-align:center;';
    document.body.appendChild(el);
  }
  el.style.background = tone === 'ok' ? '#2F6F62' : '#B0463D';
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 4000);
}

async function withRetry(fn, retries, delayMs){
  retries = retries===undefined ? 2 : retries;
  delayMs = delayMs===undefined ? 500 : delayMs;
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{ return await fn(); }
    catch(e){
      lastErr = e;
      if(i<retries) await new Promise(r=>setTimeout(r, delayMs*(i+1)));
    }
  }
  throw lastErr;
}

// ---- 원격(서버) 요청 — 여러 기기 동기화가 설정된 경우 사용 ----
async function remoteRequest(pathAndQuery, options){
  const base = (remoteConfig && remoteConfig.url) ? remoteConfig.url.replace(/\/$/,'') : '';
  const url = base + pathAndQuery;
  return withRetry(async ()=>{
    const resp = await fetch(url, Object.assign({}, options, {
      headers: Object.assign({ 'x-app-token': (remoteConfig && remoteConfig.token) || '' }, (options && options.headers) || {})
    }));
    if(!resp.ok){
      const text = await resp.text().catch(()=> '');
      throw new Error('서버 응답 오류 ('+resp.status+') '+text);
    }
    return resp;
  }, 2, 500);
}

// ---- 기존(로컬/클라우드-미러) 저장 방식 — 동기화 미설정 시, 또는 마이그레이션용 ----
async function legacyStorageGet(key){
  if(HAS_CLOUD_STORAGE){
    try{
      const r = await withRetry(()=>window.storage.get(key), 2, 400);
      return r ? r.value : null;
    }catch(e){ console.error('불러오기 실패', key, e); return null; }
  }
  try{ return localStorage.getItem('budget_app_'+key); }catch(e){ return null; }
}

async function legacyStorageSet(key, value){
  if(HAS_CLOUD_STORAGE){
    try{
      await withRetry(()=>window.storage.set(key, value), 2, 500);
      return true;
    }catch(e){
      console.error('저장 실패', e);
      showToast('저장에 실패했습니다. 네트워크 확인 후 다시 시도해주세요.');
      return false;
    }
  }
  try{ localStorage.setItem('budget_app_'+key, value); return true; }
  catch(e){ console.error('저장 실패', e); showToast('저장에 실패했습니다.'); return false; }
}

async function legacyStorageDelete(key){
  if(HAS_CLOUD_STORAGE){
    try{ await withRetry(()=>window.storage.delete(key), 2, 400); }
    catch(e){ console.error('삭제 실패', key, e); }
    return;
  }
  try{ localStorage.removeItem('budget_app_'+key); }catch(e){}
}

// ---- 이 아래 세 함수가 앱 전체에서 실제로 쓰는 저장 함수입니다 ----
// 여러 기기 동기화가 설정되어 있으면 서버로, 아니면 예전 방식(로컬)으로 갑니다.
async function storageGet(key){
  if(remoteConfig && remoteConfig.token){
    try{
      const resp = await remoteRequest('/budget/kv?key='+encodeURIComponent(key));
      const data = await resp.json();
      return data.value;
    }catch(e){
      console.error('원격 불러오기 실패', key, e);
      showToast('서버에서 데이터를 불러오지 못했습니다: '+(e.message||e));
      return null;
    }
  }
  return legacyStorageGet(key);
}

async function storageSet(key, value){
  if(remoteConfig && remoteConfig.token){
    try{
      await remoteRequest('/budget/kv', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, value })
      });
      return true;
    }catch(e){
      console.error('원격 저장 실패', key, e);
      showToast('서버 저장에 실패했습니다: '+(e.message||e));
      return false;
    }
  }
  return legacyStorageSet(key, value);
}

async function storageDelete(key){
  if(remoteConfig && remoteConfig.token){
    try{ await remoteRequest('/budget/kv?key='+encodeURIComponent(key), { method: 'DELETE' }); }
    catch(e){ console.error('원격 삭제 실패', key, e); }
    return;
  }
  return legacyStorageDelete(key);
}

// ---- 이 기기에 이미 있던 로컬 데이터를 서버로 한 번에 옮기기 ----
async function migrateLocalDataToServer(){
  if(!remoteConfig || !remoteConfig.token){ showToast('먼저 동기화 설정을 저장해주세요.'); return; }
  showToast('이 기기의 데이터를 서버로 옮기는 중...', 'ok');
  try{
    const keysToMove = [];
    const monthsRaw = await legacyStorageGet('months-list');
    if(monthsRaw){
      keysToMove.push('months-list');
      try{
        const monthsArr = JSON.parse(monthsRaw);
        if(Array.isArray(monthsArr)) monthsArr.forEach(m=>keysToMove.push('month:'+m));
      }catch(e){}
    }
    ['savings-list','investments-list','toss-sync-config'].forEach(k=>keysToMove.push(k));

    let moved = 0;
    for(const key of keysToMove){
      const val = await legacyStorageGet(key);
      if(val !== null && val !== undefined){
        await remoteRequest('/budget/kv', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value: val })
        });
        moved++;
      }
    }
    showToast(moved+'개 항목을 서버로 옮겼습니다. 다시 불러올게요.', 'ok');
    await loadMonthList();
    await loadSavings();
    await loadInvestments();
    await loadTossConfig();
    data = await loadMonthData(currentMonth);
    render();
  }catch(e){
    console.error(e);
    showToast('마이그레이션 중 오류가 발생했습니다: '+(e.message||e));
  }
}

// ---- 백업 파일로 내보내기 / 불러오기 (기기를 옮길 때 수동 백업용) ----
async function exportBackup(){
  try{
    const monthsRaw = await storageGet('months-list');
    const monthsArr = monthsRaw ? JSON.parse(monthsRaw) : [];
    const monthData = {};
    for(const m of monthsArr){
      const raw = await storageGet('month:'+m);
      if(raw) monthData[m] = JSON.parse(raw);
    }
    const savingsRaw = await storageGet('savings-list');
    const investmentsRaw = await storageGet('investments-list');
    const tossRaw = await storageGet('toss-sync-config');
    const backup = {
      exportedAt: new Date().toISOString(),
      months: monthsArr,
      monthData,
      savings: savingsRaw ? JSON.parse(savingsRaw) : [],
      investments: investmentsRaw ? JSON.parse(investmentsRaw) : [],
      tossConfig: tossRaw ? JSON.parse(tossRaw) : null
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '가계부백업_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('백업 파일을 저장했습니다.', 'ok');
  }catch(e){
    console.error(e);
    showToast('백업 파일 저장에 실패했습니다: '+(e.message||e));
  }
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const backup = JSON.parse(reader.result);
      if(!backup || !Array.isArray(backup.months)){ showToast('올바른 백업 파일이 아닙니다.'); return; }
      await storageSet('months-list', JSON.stringify(backup.months));
      for(const m of backup.months){
        const md = backup.monthData && backup.monthData[m];
        if(md) await storageSet('month:'+m, JSON.stringify(md));
      }
      if(backup.savings) await storageSet('savings-list', JSON.stringify(backup.savings));
      if(backup.investments) await storageSet('investments-list', JSON.stringify(backup.investments));
      if(backup.tossConfig) await storageSet('toss-sync-config', JSON.stringify(backup.tossConfig));
      showToast('백업을 불러왔습니다.', 'ok');
      await loadMonthList();
      await loadSavings();
      await loadInvestments();
      await loadTossConfig();
      data = await loadMonthData(currentMonth);
      render();
    }catch(e){
      console.error(e);
      showToast('백업 파일을 읽지 못했습니다: '+(e.message||e));
    }
  };
  reader.readAsText(file);
}

async function syncTossHoldings(){
  if(!tossConfig.url || !tossConfig.token){
    showToast('프록시 서버 주소와 앱 토큰을 먼저 입력하고 저장해주세요.');
    return;
  }
  tossSyncing = true;
  render();
  try{
    const resp = await fetch(tossConfig.url + '/holdings', {
      headers: { 'x-app-token': tossConfig.token }
    });
    if(!resp.ok){
      const body = await resp.text().catch(()=> '');
      throw new Error('서버 응답 오류 ('+resp.status+') '+body);
    }
    const data = await resp.json();
    const items = Array.isArray(data.items) ? data.items : [];
    let updated = 0, added = 0;
    const today = new Date().toISOString().slice(0,10);
    items.forEach(it=>{
      if(!it.symbol && !it.name) return;
      const idx = investments.findIndex(x=>x.type==='주식' && x.externalId && x.externalId===it.symbol);
      const qty = Number(it.qty)||null;
      const price = Number(it.currentPrice)||null;
      const amount = Number(it.purchaseAmount) || (qty && Number(it.avgPrice) ? qty*Number(it.avgPrice) : 0);
      if(idx!==-1){
        investments[idx] = Object.assign({}, investments[idx], {
          name: it.name || investments[idx].name,
          qty, price,
          amount: amount || investments[idx].amount
        });
        updated++;
      } else {
        investments.push({
          id: uid(), type:'주식', name: it.name || it.symbol, amount: amount||0,
          date: today, memo: '토스증권 자동 연동', qty, price,
          externalId: it.symbol, source: 'toss'
        });
        added++;
      }
    });
    await saveInvestments();
    tossLastSynced = new Date().toISOString();
    await saveTossConfig();
    showToast(`동기화 완료 — 신규 ${added}건, 갱신 ${updated}건`, 'ok');
  }catch(err){
    console.error(err);
    showToast('동기화에 실패했습니다: '+(err.message||err));
  }
  tossSyncing = false;
  render();
}

function readInvestmentForm(type, form){
  const name = form.querySelector('[name=iname]').value.trim();
  const amount = parseAmountInput(form.querySelector('[name=iamount]').value);
  const date = form.querySelector('[name=idate]').value;

  if(!amount || amount <= 0){ showToast('금액을 입력해주세요.'); return null; }

  const item = { type, name, amount, date, memo };

  if(type==='예금' || type==='적금' || type==='채권'){
    const rate = form.querySelector('[name=irate]').value;
    const maturity = form.querySelector('[name=imaturity]').value;
    if(maturity && date && maturity < date){ showToast('만기일이 시작일보다 빠를 수 없습니다.'); return null; }
    item.rate = rate ? Number(rate) : null;

    const price = priceEl ? parseAmountInput(priceEl.value) : 0;
    item.qty = qty ? Number(qty) : null;
    item.price = price || null;
  } else if(type==='보험'){
    const payType = form.querySelector('[name=ipaytype]').value;
    const rateType = form.querySelector('[name=irateType2]').value;
    const rateVal = form.querySelector('[name=irate2]').value;
    const maturity = form.querySelector('[name=imaturity2]').value;
    const expected = parseAmountInput(form.querySelector('[name=iexpected]').value);
    if(maturity && date && maturity < date){ showToast('만기일이 시작일보다 빠를 수 없습니다.'); return null; }
    item.payType = payType;
    item.rateType = rateType;
    item.rateValue = rateVal ? Number(rateVal) : null;
    item.maturityDate = maturity || '';
    item.expected = expected || null;
  }
  return item;
}

function investDetail(x){
  if(x.type==='예금' || x.type==='적금' || x.type==='채권'){
    const bits = [];
    if(x.rate!==null && x.rate!==undefined) bits.push('금리 '+x.rate+'%');
    if(x.maturityDate) bits.push('만기 '+x.maturityDate);
    return bits.length ? bits.join(' · ') : '-';
  }
  if(x.type==='주식'){
    const bits = [];
    if(x.qty) bits.push(x.qty+'주');
    if(x.price) bits.push('현재가 '+won(x.price));
    if(x.qty && x.price){
      const val = x.qty * x.price;
      const pl = val - Number(x.amount||0);
      const plPct = x.amount ? (pl/x.amount*100) : 0;
      const color = pl >= 0 ? 'var(--jade)' : 'var(--rust)';
      bits.push('평가금액 '+won(val));
      bits.push(`<span style="color:${color};font-weight:700;">${pl>=0?'+':''}${won(pl)} (${plPct.toFixed(1)}%)</span>`);
    }
    return bits.length ? bits.join(' · ') : '-';
  }
  if(x.type==='보험'){
    const bits = [];
    if(x.payType) bits.push(x.payType==='installment' ? '적립성' : '일시납');
    if(x.rateValue!==null && x.rateValue!==undefined){
      bits.push((x.rateType==='maturity' ? '만기시 이자율' : '연 이자') + ' ' + x.rateValue + '%');
    }
    if(x.maturityDate) bits.push('만기 '+x.maturityDate);
    if(x.expected) bits.push('기대금액 '+won(x.expected));
    return bits.length ? bits.join(' · ') : '-';
  }
  return '-';
}

function totals(){
  const income = data.income.reduce((s,x)=>s+Number(x.amount||0),0);
  const fixed = data.fixed.reduce((s,x)=>s+Number(x.amount||0),0);
  const variable = data.variable.reduce((s,x)=>s+Number(x.amount||0),0);
  const savings = data.fixed.filter(x=>x.category==='저축/투자').reduce((s,x)=>s+Number(x.amount||0),0);
  const expense = fixed + variable;
  const balance = income - expense;
  return {income, fixed, variable, expense, savings, balance};
}

async function createMonthWithBudgetCopy(m){
  if(months.includes(m)) return true;
  const priorCandidates = months.filter(x=>x<m).sort();
  const prior = priorCandidates.length ? priorCandidates[priorCandidates.length-1] : null;
  let budgets = {};
  let variable = [];
  let fixed = [];
  if(prior){
    const priorData = await loadMonthData(prior);
    budgets = Object.assign({}, priorData.budgets);
    variable = (priorData.variable || []).map(x=>Object.assign({}, x, { id: uid() }));
    fixed = (priorData.fixed || [])
      .filter(x=>x.category==='할부/대출' && x.installmentTotal && x.installmentNo < x.installmentTotal)
      .map(x=>Object.assign({}, x, { id: uid(), installmentNo: x.installmentNo + 1 }));
  }
  const newData = emptyMonthData();
  newData.budgets = budgets;
  newData.variable = variable;
  newData.fixed = fixed;
  const ok = await storageSet('month:'+m, JSON.stringify(newData));
  if(ok) months.push(m);
  return ok;
}

async function addMonthsFromInput(rawVal){
  const v = (rawVal||'').trim();
  let targets = [];
  if(/^\d{4}$/.test(v)){
    for(let i=1;i<=12;i++) targets.push(v+'-'+String(i).padStart(2,'0'));
  } else if(/^\d{4}-\d{2}$/.test(v)){
    targets.push(v);
  } else {
    showToast('YYYY 또는 YYYY-MM 형식으로 입력해주세요. (예: 2026 또는 2026-04)');
    return;
  }
  let firstNew = null;
  let failed = [];
  for(const m of targets){
    if(!months.includes(m)){
      const ok = await createMonthWithBudgetCopy(m);
      if(ok){ if(!firstNew) firstNew = m; }
      else { failed.push(m); }
      if(targets.length > 1) await new Promise(r=>setTimeout(r, 150));
    }
  }
  months.sort();
  await saveMonthList();
  addMonthFormOpen = false;
  if(failed.length){
    showToast(failed.length+'개 달 추가에 실패했습니다: '+failed.join(', ')+' — 다시 시도해주세요.');
  } else if(firstNew){
    showToast(monthLabel(firstNew)+(targets.length>1?' 외 '+(targets.length-1)+'개 달이 추가되었습니다.':'이 추가되었습니다.'), 'ok');
  }
  await switchMonth(firstNew || currentMonth);
}

function groupTotals(list){
  const map = {};
  list.forEach(x=>{
    map[x.category] = (map[x.category]||0) + Number(x.amount||0);
  });
  return map;
}

function donutCardHtml(id, title, totalsMap, emptyMsg){
  const keys = Object.keys(totalsMap).sort((a,b)=>totalsMap[b]-totalsMap[a]);
  const isEmpty = keys.length===0;
  const ariaText = keys.map(k=>k+' '+totalsMap[k]).join(', ');
  return { keys, isEmpty, html: `
    <div class="card">
      <div class="panel-title">${title}</div>
      ${isEmpty ? `<div class="legend-row"><span style="color:var(--ink-faint);">${emptyMsg}</span></div>` : `
      <div class="legend-row">
        ${keys.slice(0,8).map(c=>`<span><span class="legend-dot" style="background:${CAT_COLOR[c]||'#999'}"></span>${c} ${won(totalsMap[c])}</span>`).join('')}
      </div>`}
      <div style="position:relative;height:220px;">
        <canvas id="${id}" role="img" aria-label="${title} 도넛 차트">${isEmpty ? emptyMsg : title+': '+ariaText}</canvas>
      </div>
    </div>` };
}

function savingsCardHtml(){
  const typeTotals = {};
  savings.forEach(s=>{
    const label = s.type==='lumpsum' ? '일시납' : (s.type==='installment' ? '적립성' : '미분류');
    typeTotals[label] = (typeTotals[label]||0) + Number(s.expected||0);
  });
  const keys = Object.keys(typeTotals).sort((a,b)=>typeTotals[b]-typeTotals[a]);
  const total = savings.reduce((s,x)=>s+Number(x.expected||0),0);
  const isEmpty = savings.length===0;
  const html = `
    <div class="card">
      <div class="panel-title">저축 현황</div>
      ${isEmpty ? `<div class="legend-row"><span style="color:var(--ink-faint);">아직 등록된 저축이 없습니다.</span></div>` : `
      <div class="legend-row">
        ${keys.map(k=>`<span><span class="legend-dot" style="background:${CAT_COLOR[k]||'#999'}"></span>${k} ${won(typeTotals[k])}</span>`).join('')}
      </div>`}
      <div style="position:relative;height:220px;">
        <canvas id="savingsDonut" role="img" aria-label="저축 현황 도넛 차트">${isEmpty ? '아직 등록된 저축이 없습니다.' : '저축 현황: '+keys.map(k=>k+' '+typeTotals[k]).join(', ')}</canvas>
      </div>
      ${!isEmpty ? `<div class="section-note" style="margin-top:10px;">등록 ${savings.length}건 · 만기시 기대금액 합계 ${won(total)}</div>` : ''}
    </div>`;
  return { keys, typeTotals, html };
}

function collectMaturingAssets(){
  const now = new Date(); now.setHours(0,0,0,0);
  const WINDOW_DAYS = 31;
  const results = [];
  savings.forEach(s=>{
    if(!s.endDate) return;
    const d = new Date(s.endDate);
    const diffDays = Math.round((d - now)/(1000*60*60*24));
    if(Math.abs(diffDays) <= WINDOW_DAYS){
      results.push({ name:s.name, source:'저축', date:s.endDate, amount:s.expected, diffDays });
    }
  });
  investments.forEach(x=>{
    if(!x.maturityDate) return;
    const d = new Date(x.maturityDate);
    const diffDays = Math.round((d - now)/(1000*60*60*24));
    if(Math.abs(diffDays) <= WINDOW_DAYS){
      results.push({ name:x.name, source:x.type, date:x.maturityDate, amount: x.expected || x.amount, diffDays });
    }
  });
  results.sort((a,b)=>a.diffDays-b.diffDays);
  return results;
}

function maturingAssetsHtml(){
  const items = collectMaturingAssets();
  if(items.length===0) return '';
  return `
  <div class="card" style="border-color:var(--brass);border-width:1.5px;">
    <div class="panel-title">⏰ 만기 임박 자산 (±1개월)</div>
    <table class="ledger">
      <thead><tr><th>이름</th><th>구분</th><th>만기일</th><th>D-day</th><th style="text-align:right;">금액</th></tr></thead>
      <tbody>
        ${items.map(it=>{
          const dtext = it.diffDays>0 ? 'D-'+it.diffDays : (it.diffDays===0 ? 'D-Day' : '만기 '+Math.abs(it.diffDays)+'일 경과');
          const tagColor = it.source==='저축' ? '#A9832F' : (INV_COLOR[it.source]||'#7D7568');
          return `<tr>
            <td>${it.name}</td>
            <td><span class="tag" style="background:${tagColor};">${it.source}</span></td>
            <td>${it.date}</td>
            <td style="color:${it.diffDays<0?'var(--rust)':'var(--ink)'};font-weight:700;">${dtext}</td>
            <td class="num">${won(it.amount||0)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function budgetRowHtml(cat, actual, budget){
  const pct = budget>0 ? Math.min(100, Math.round(actual/budget*100)) : 0;
  const over = budget>0 && actual > budget;
  const barColor = over ? 'var(--rust)' : (pct>80 ? 'var(--amber-ink)' : 'var(--jade)');
  return `
    <div class="budget-row">
      <div class="budget-cat"><span class="legend-dot" style="background:${CAT_COLOR[cat]||'#999'}"></span>${cat}</div>
      <div>
        <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${budget>0?pct:0}%;background:${barColor};"></div></div>
        <div class="budget-nums">${won(actual)} 사용 ${budget>0 ? '/ ' + won(budget) + ' 예산 (' + pct + '%)' : '(예산 미설정)'}</div>
      </div>
      <input class="field budget-input num-fmt" type="text" placeholder="예산 입력" value="${budget ? Number(budget).toLocaleString('ko-KR') : ''}" data-cat="${cat}">
    </div>
  `;
}

function savingsProgress(s){
  if(!s.startDate || !s.endDate) return null;
  const start = new Date(s.startDate).getTime();
  const end = new Date(s.endDate).getTime();
  const now = Date.now();
  if(!(end > start)) return null;
  let pct = Math.round((now-start)/(end-start)*100);
  pct = Math.max(0, Math.min(100, pct));
  return pct;
}

function savingsDday(s){
  if(!s.endDate) return null;
  const end = new Date(s.endDate).getTime();
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.ceil((end - now.getTime())/(1000*60*60*24));
  return diff;
}
